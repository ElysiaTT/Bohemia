<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" fill="none">
  <title>Bohemia — A Personal Rhapsody</title>
  <desc>An original record sleeve with a vinyl disc, vermilion circles and intertwining sound waves.</desc>
  <defs>
    <radialGradient id="disc" cx=".35" cy=".3" r=".8"><stop stop-color="#36302a"/><stop offset=".6" stop-color="#201e1c"/><stop offset="1" stop-color="#151514"/></radialGradient>
    <linearGradient id="sheen" x1="350" y1="180" x2="710" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#d5b98c" stop-opacity=".16"/><stop offset=".45" stop-color="#cab38e" stop-opacity="0"/><stop offset=".8" stop-color="#eadac0" stop-opacity=".09"/><stop offset="1" stop-color="#cab38e" stop-opacity="0"/></linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#f3e7ca" opacity=".1"/><circle cx="5" cy="5" r=".4" fill="#f3e7ca" opacity=".07"/></pattern>
  </defs>
  <path fill="#27221f" d="M0 0h1000v800H0z"/>
  <path fill="url(#grain)" d="M0 0h1000v800H0z"/>
  <path d="M48 50h904M48 749h904" stroke="#dac7a8" stroke-opacity=".28"/>
