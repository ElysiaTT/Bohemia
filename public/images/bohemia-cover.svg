  <text x="255" y="633" text-anchor="middle" fill="#baa07f" font-family="monospace" font-size="8" letter-spacing="1.8">BALLAD / OPERA / ROCK / CODA</text>
  <!-- record-vinyl:start -->
  <g id="record-vinyl" data-center="709 463" data-outer-radius="240">
    <circle cx="709" cy="463" r="240" fill="#a43840"/>
    <circle cx="709" cy="463" r="228" stroke="#eac194" stroke-opacity=".52"/>
    <circle cx="709" cy="463" r="208" fill="url(#vinyl)"/>
    <g stroke="#eac194" stroke-opacity=".13"><circle cx="709" cy="463" r="198" /><circle cx="709" cy="463" r="187" /><circle cx="709" cy="463" r="176" /><circle cx="709" cy="463" r="165" /><circle cx="709" cy="463" r="154" /><circle cx="709" cy="463" r="143" /><circle cx="709" cy="463" r="132" /><circle cx="709" cy="463" r="121" /><circle cx="709" cy="463" r="110" /><circle cx="709" cy="463" r="99" /></g>
    <circle cx="709" cy="463" r="208" fill="url(#sheen)"/>
    <circle cx="709" cy="463" r="65" fill="#e8d5b0"/>
    <circle cx="709" cy="463" r="57" stroke="#86323b" stroke-opacity=".35"/>
    <text x="709" y="449" text-anchor="middle" fill="#86323b" font-family="Georgia,serif" font-size="17" font-style="italic">Bohemia.</text>
    <circle cx="709" cy="463" r="6" fill="#252329"/>
    <text x="709" y="490" text-anchor="middle" fill="#86323b" font-family="monospace" font-size="7" letter-spacing="1.7">A / 33⅓ RPM</text>
  </g>
  <!-- record-vinyl:end -->
  <text x="53" y="204" fill="#f4e6c9" font-family="Georgia,'Times New Roman',serif" font-size="151" font-style="italic" letter-spacing="-7">Bohemia.</text>
  <text x="62" y="244" fill="#e7c99b" font-family="monospace" font-size="11" letter-spacing="4.2">MANY MOVEMENTS. ONE VOICE.</text>
  <path d="M56 651h356" stroke="#d2ad7a" stroke-opacity=".4"/>
  <text x="56" y="684" fill="#f0ddba" font-family="Georgia,serif" font-size="28" font-style="italic">The Signal</text>
  <text x="57" y="712" fill="#c3a688" font-family="monospace" font-size="9" letter-spacing="2.1">REASON / MODELS / NEW WORLDS</text>
  <text x="954" y="720" text-anchor="end" fill="#ddc5a4" font-family="monospace" font-size="10" letter-spacing="2">08 COLUMNS / SIDE A</text>
  <text x="44" y="777" fill="#c1a88b" font-family="monospace" font-size="10" letter-spacing="1.6">INSPIRED BY QUEEN · BOHEMIAN RHAPSODY</text>
  <text x="956" y="777" text-anchor="end" fill="#c1a88b" font-family="monospace" font-size="9" letter-spacing="2">A — 001</text>
