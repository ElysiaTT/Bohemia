  <text x="950" y="30" text-anchor="end" fill="#d2c0a5" font-family="monospace" font-size="11" letter-spacing="2">VOL. 01</text>
  <circle cx="624" cy="409" r="280" fill="#9f3039"/>
  <circle cx="624" cy="409" r="265" stroke="#d58a78" stroke-opacity=".3"/>
  <circle cx="624" cy="409" r="242" fill="url(#disc)"/>
  <g stroke="#c3ad8c" stroke-opacity=".13">
    <circle cx="624" cy="409" r="230"/><circle cx="624" cy="409" r="221"/><circle cx="624" cy="409" r="212"/><circle cx="624" cy="409" r="203"/><circle cx="624" cy="409" r="194"/><circle cx="624" cy="409" r="185"/><circle cx="624" cy="409" r="176"/><circle cx="624" cy="409" r="167"/><circle cx="624" cy="409" r="158"/><circle cx="624" cy="409" r="149"/><circle cx="624" cy="409" r="140"/><circle cx="624" cy="409" r="131"/><circle cx="624" cy="409" r="122"/><circle cx="624" cy="409" r="113"/>
  </g>
  <circle cx="624" cy="409" r="242" fill="url(#sheen)"/>
  <circle cx="624" cy="409" r="86" fill="#e8dcc3"/>
  <circle cx="624" cy="409" r="77" stroke="#443730" stroke-opacity=".3"/>
  <text x="624" y="380" text-anchor="middle" fill="#8f3038" font-family="Georgia,serif" font-style="italic" font-size="26">Bohemia</text>
  <text x="624" y="439" text-anchor="middle" fill="#4e4237" font-family="monospace" font-size="8" letter-spacing="3">A PERSONAL RHAPSODY</text>
  <text x="624" y="455" text-anchor="middle" fill="#4e4237" font-family="monospace" font-size="8" letter-spacing="2">SIDE A / 33⅓ RPM</text>
  <circle cx="624" cy="409" r="9" fill="#27221f"/>
  <circle cx="624" cy="409" r="3" fill="#f5f1e8"/>
  <text x="44" y="187" fill="#f1e6cf" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="140" letter-spacing="-7">Bohemia.</text>
  <text x="53" y="230" fill="#d8c5a8" font-family="monospace" font-size="13" letter-spacing="5">A PERSONAL RHAPSODY</text>
  <g stroke-linecap="round">
    <path d="M-35 544C115 544 148 323 263 323s94 299 213 299 133-317 251-317 116 235 307 235" stroke="#ebdbc0" stroke-width="2"/>
    <path d="M-35 559C117 559 147 344 263 344s94 299 213 299 133-317 251-317 116 235 307 235" stroke="#c89564" stroke-width="1.5"/>
