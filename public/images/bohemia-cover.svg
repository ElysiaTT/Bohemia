  <text x="53" y="699" fill="#f0e3cc" font-family="Georgia,serif" font-style="italic" font-size="25">Different voices. One stage.</text>
  <text x="53" y="726" fill="#b9a78e" font-family="monospace" font-size="9" letter-spacing="2">THOUGHTS / STORIES / THINGS WORTH KEEPING</text>
