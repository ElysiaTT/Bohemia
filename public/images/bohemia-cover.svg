  <path d="M0 0h104q-3 140 43 253l-40 547H0zM1000 0H929q8 152-19 242l47 558h43z" fill="url(#curtain)"/>
  <path d="M25 0q-8 160 32 286L27 800M66 0q-4 149 34 270L71 800M972 0q-2 174-22 271l36 529" stroke="#e5a08b" stroke-opacity=".13" stroke-width="2"/>
