<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Bohemia. — Side A</title>
  <desc id="description">An original theatrical record sleeve inspired by Queen and Bohemian Rhapsody: vermilion curtains, golden stage light, an abstract celestial rosette and a black vinyl record.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="900" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#321f20"/><stop offset=".52" stop-color="#241d1c"/><stop offset="1" stop-color="#141719"/></linearGradient>
    <linearGradient id="curtain" x1="50" y1="200" x2="540" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#b13f45"/><stop offset=".55" stop-color="#7e2b35"/><stop offset="1" stop-color="#44232c"/></linearGradient>
    <linearGradient id="light" x1="620" y1="118" x2="540" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#efd2a0" stop-opacity=".52"/><stop offset="1" stop-color="#efd2a0" stop-opacity="0"/></linearGradient>
    <radialGradient id="vinyl" cx=".34" cy=".3" r=".8"><stop stop-color="#3d3530"/><stop offset=".48" stop-color="#252222"/><stop offset="1" stop-color="#0d1012"/></radialGradient>
    <linearGradient id="sheen" x1="580" y1="230" x2="860" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#e9cf9f" stop-opacity=".2"/><stop offset=".48" stop-color="#e9cf9f" stop-opacity="0"/><stop offset=".78" stop-color="#e9cf9f" stop-opacity=".13"/><stop offset="1" stop-color="#e9cf9f" stop-opacity="0"/></linearGradient>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#f1dfbd" opacity=".09"/><circle cx="5" cy="6" r=".45" fill="#f1dfbd" opacity=".05"/></pattern>
    <clipPath id="rosette"><circle cx="255" cy="455" r="127"/></clipPath>
  </defs>
  <path fill="url(#stage)" d="M0 0h1000v800H0z"/>
  <path d="M0 0h340v800H0z" fill="url(#curtain)"/>
