      <path d="M-26-9q12-8 22 2l-3 7-16-3zm52 0Q14-17 4-7l3 7 16-3z" fill="#362d29"/>
      <path d="M-23-5q9-5 17 0M6-5q9-5 17 0" stroke="#14151a" stroke-width="3" stroke-linecap="round"/>
      <path d="m0-7-5 24 8 3 4-3" stroke="#ddc19c" stroke-opacity=".45" stroke-width="1.4"/>
      <path d="M-12 29q12-5 24 0l-7 3H-5z" fill="#211c20"/>
      <path d="M-29-22q10-14 22-13m13 0q12-1 23 13" stroke="#fae7c7" stroke-opacity=".18" stroke-width="1.5"/>
      <path d="m-17 45-5 12h44l-17-9" fill="#18171d"/>
