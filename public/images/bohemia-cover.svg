<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Bohemia. — Side A</title>
  <desc id="description">An original tribute to the drama of Queen's Bohemian Rhapsody: four illuminated theatrical faces in a diamond, an opera proscenium, burgundy curtains and a golden-lit vinyl record.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="900" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#301f24"/><stop offset=".52" stop-color="#201b1e"/><stop offset="1" stop-color="#121519"/></linearGradient>
    <linearGradient id="curtain" x1="0" y1="100" x2="300" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#95303e"/><stop offset=".55" stop-color="#612432"/><stop offset="1" stop-color="#301d28"/></linearGradient>
    <radialGradient id="spotlight"><stop stop-color="#e9c892" stop-opacity=".17"/><stop offset="1" stop-color="#1a181c" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="585" y1="90" x2="585" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#ebd4ae" stop-opacity=".2"/><stop offset="1" stop-color="#ebd4ae" stop-opacity="0"/></linearGradient>
    <linearGradient id="face-light" x1="-9" y1="-40" x2="9" y2="50" gradientUnits="userSpaceOnUse"><stop stop-color="#e5d1af"/><stop offset=".3" stop-color="#b99f7e"/><stop offset=".63" stop-color="#6a5447"/><stop offset="1" stop-color="#201b20"/></linearGradient>
    <radialGradient id="vinyl" cx=".34" cy=".3" r=".8"><stop stop-color="#3d3530"/><stop offset=".48" stop-color="#252222"/><stop offset="1" stop-color="#0d1012"/></radialGradient>
    <linearGradient id="sheen" x1="580" y1="230" x2="860" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#e9cf9f" stop-opacity=".2"/><stop offset=".48" stop-color="#e9cf9f" stop-opacity="0"/><stop offset=".78" stop-color="#e9cf9f" stop-opacity=".13"/><stop offset="1" stop-color="#e9cf9f" stop-opacity="0"/></linearGradient>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#f1dfbd" opacity=".09"/><circle cx="5" cy="6" r=".45" fill="#f1dfbd" opacity=".05"/></pattern>
    <g id="theatrical-face">
      <path d="M-47 40c-8-26-4-65 12-82 10-15 45-18 64-3 23 17 29 58 18 85L25 58h-50z" fill="#111318"/>
      <path d="m-18 40-28 13-12 28H58L44 53 18 40z" fill="#121318"/>
