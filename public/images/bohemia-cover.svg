    <path d="M120 449c-22-8-20-29-12-40-17-15 0-30 12-29-4-17 16-25 26-17 12-18 28-12 32 1 17-5 31 7 27 22 17 9 18 24 8 34 8 15-1 32-14 34l-12-65-52 4z" fill="#15151b"/>
    <use href="#theatrical-face" transform="translate(164 431) scale(1.04)"/>
    <use href="#theatrical-face" transform="translate(346 431) scale(1.04)"/>
    <path d="M309 410q5-40 37-31 25-8 35 28l-18-15-14-2-20 8z" fill="#201d20"/>
